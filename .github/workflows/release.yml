name: Release

# Builds the installers on each platform's own runner and attaches them to a GitHub Release,
# together with the standalone server. Triggered by pushing a version tag, e.g.:
#   git tag v2.0.0 && git push origin v2.0.0
# Every installer has the server built in (an install runs its own: see LocalServer.kt), and
# -PwithWeb adds the browser version so phones and other computers can use it too.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}   # also runnable by hand from the Actions tab

permissions:
  contents: write          # needed to create/update the Release

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (.msi)
            task: ':shared:packageMsi'
            artifact: shared/build/compose/binaries/main/msi/*.msi
          - os: macos-latest
            label: macOS (.dmg)
            task: ':shared:packageDmg'
            artifact: shared/build/compose/binaries/main/dmg/*.dmg
          - os: ubuntu-latest
            label: Linux (.deb)
            task: ':shared:packageDeb'
            artifact: shared/build/compose/binaries/main/deb/*.deb
          - os: ubuntu-latest
            label: Server (.zip)
            task: ':server:distZip'
            artifact: dist/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils

      - name: Build
        shell: bash
        run: |
          chmod +x ./gradlew || true
          ./gradlew ${{ matrix.task }} -PwithWeb --no-daemon --stacktrace

      - name: Name the server zip
        if: matrix.task == ':server:distZip'
        shell: bash
        run: |
          mkdir -p dist
          cp server/build/distributions/server.zip "dist/NodeNote-Server-${GITHUB_REF_NAME}.zip"

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}

      # When run manually (no tag), keep the build as a downloadable artifact instead.
      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: NodeNote-${{ matrix.os }}-${{ strategy.job-index }}
          path: ${{ matrix.artifact }}
